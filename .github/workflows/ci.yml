name: CI

# Runs on every push to main and every pull request (the repository is public, so
# Actions minutes are free), and by hand from the Actions tab or `gh workflow run CI`.
# The same checks run locally before every commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-guard:
    name: Privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on tracked private-looking files
        shell: bash
        run: |
          # Only README screenshots in docs/images/ may be images; databases, logs,
          # archives, keys and env files must never be committed.
          bad=$(git ls-files | grep -iE '\.(png|jpe?g|webp|heic|gif|db|db-.*|sqlite3?|log|zip|bak|pem|key)$|(^|/)\.env($|\.)' | grep -vE '^docs/images/[^/]+\.(png|jpe?g|webp|gif)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Private-looking files are tracked:"; echo "$bad"; exit 1
          fi
          echo "No private-looking files tracked."

  test:
    name: Tests, lint and build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync --locked --python 3.12

      - name: Tests
        run: uv run --locked pytest

      - name: Lint
        run: uv run --locked ruff check .

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build
